<nav class="tab-bar">
  <a
    class="tab-btn"
    routerLink="/"
    routerLinkActive="active"
    [routerLinkActiveOptions]="exactPath"
    ariaCurrentWhenActive="page"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
      <polyline points="9 22 9 12 15 12 15 22" />
    </svg>
    <span>Home</span>
  </a>

  <a
    class="tab-btn"
    routerLink="/explore"
    routerLinkActive="active"
    [routerLinkActiveOptions]="exactPath"
    ariaCurrentWhenActive="page"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="10" />
      <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
    </svg>
    <span>Explore</span>
  </a>

  <button type="button" class="tab-btn tab-btn-search" (click)="newReview.open()">
    <!-- Same 22px icon slot as the other tabs, so the label lines up; the circle overflows it upwards -->
    <span class="search-slot">
      <span class="search-circle">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="7" />
          <line x1="16" y1="16" x2="20.5" y2="20.5" />
        </svg>
      </span>
    </span>
    <span>Search</span>
  </button>

  <a
    class="tab-btn"
    routerLink="/community"
    routerLinkActive="active"
    [routerLinkActiveOptions]="exactPath"
    ariaCurrentWhenActive="page"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
      <circle cx="9" cy="7" r="4" />
      <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
      <path d="M16 3.13a4 4 0 0 1 0 7.75" />
    </svg>
    <span>Community</span>
  </a>

  <a
    class="tab-btn"
    routerLink="/tierlists"
    routerLinkActive="active"
    [routerLinkActiveOptions]="exactPath"
    ariaCurrentWhenActive="page"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <rect x="3" y="3" width="18" height="4" rx="1" />
      <rect x="3" y="10" width="14" height="4" rx="1" />
      <rect x="3" y="17" width="10" height="4" rx="1" />
    </svg>
    <span>Tierlists</span>
  </a>
</nav>
