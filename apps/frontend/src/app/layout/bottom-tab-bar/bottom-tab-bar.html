<nav class="tab-bar">
  <a
    class="tab-btn"
    routerLink="/"
    routerLinkActive="active"
    [routerLinkActiveOptions]="exactPath"
    ariaCurrentWhenActive="page"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
      <polyline points="9 22 9 12 15 12 15 22" />
    </svg>
    <span>Home</span>
  </a>

  <a
    class="tab-btn"
    routerLink="/explore"
    routerLinkActive="active"
    [routerLinkActiveOptions]="exactPath"
    ariaCurrentWhenActive="page"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="10" />
      <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
    </svg>
    <span>Explore</span>
  </a>

  <button type="button" class="tab-btn tab-btn-add" (click)="newReview.open()">
    <!-- Same 22px icon slot as the other tabs, so the label lines up; the circle overflows it upwards -->
    <span class="add-slot">
      <span class="add-circle">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </span>
    </span>
    <span>Search</span>
  </button>

  <button type="button" class="tab-btn" disabled>
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
      <path d="M13.73 21a2 2 0 0 1-3.46 0" />
    </svg>
    <span>Activity</span>
  </button>

  <a
    class="tab-btn"
    routerLink="/tierlists"
    routerLinkActive="active"
    [routerLinkActiveOptions]="exactPath"
    ariaCurrentWhenActive="page"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <rect x="3" y="3" width="18" height="4" rx="1" />
      <rect x="3" y="10" width="14" height="4" rx="1" />
      <rect x="3" y="17" width="10" height="4" rx="1" />
    </svg>
    <span>Tierlists</span>
  </a>
</nav>
