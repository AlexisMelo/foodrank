<div
  class="rating-card"
  [class.rating-card-with-actions]="actions().length > 0"
  [class.inactive]="!rating().isActive"
>
  <a
    [routerLink]="profileLink()"
    class="rating-link"
    [attr.title]="rating().isActive ? null : 'Replaced by a more recent rating'"
  >
    <div class="rating-author">
      @if (rating().userAvatarUrl; as avatarUrl) {
        <img [src]="avatarUrl" alt="" class="author-avatar author-avatar-img" />
      } @else {
        <span class="author-avatar">{{ initial() }}</span>
      }
      <div class="author-info">
        <span class="author-name">{{ rating().userName }}</span>
        <span class="rating-date">
          {{ displayedDate() }}
          @if (rating().bonus) {
            <span title="Instant crush">💘</span>
          }
        </span>
      </div>
    </div>
    <div class="rating-scores">
      <app-rating-scores
        [food]="rating().food"
        [service]="rating().service"
        [decor]="rating().setting"
      />
      <span class="rating-avg" [style.background-color]="averageColor()">
        {{ average() | score }}
      </span>
    </div>
  </a>
  @if (actions().length) {
    <!-- Next to the link, not inside it: a link cannot hold a button -->
    <app-actions class="rating-actions" [actions]="actions()" [label]="actionsLabel()" />
  }
</div>
