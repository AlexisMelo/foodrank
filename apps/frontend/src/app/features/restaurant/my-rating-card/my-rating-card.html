<div
  class="visit-card"
  [class.inactive]="!rating().isActive"
  [attr.title]="rating().isActive ? null : 'Replaced by a more recent rating'"
>
  <span class="visit-date">
    {{ displayedDate() }}
    @if (rating().bonus) {
      <span class="crush" title="Instant crush">💘</span>
    }
  </span>
  <div class="visit-scores">
    <app-rating-scores
      [food]="rating().food"
      [service]="rating().service"
      [decor]="rating().setting"
    />
    <span class="visit-avg" [style.background-color]="scoreColor(average())">
      {{ average() | score }}
    </span>
  </div>
</div>
