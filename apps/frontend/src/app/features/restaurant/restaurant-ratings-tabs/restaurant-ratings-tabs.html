<div class="visits-section">
  <div class="tab-row">
    <div class="tab-bar">
      <button
        type="button"
        class="tab-btn tab-mine"
        [class.tab-btn-active]="activeTab() === 'mine'"
        [attr.aria-pressed]="activeTab() === 'mine'"
        (click)="activeTab.set('mine')"
      >
        My Visits
      </button>
      <button
        type="button"
        class="tab-btn tab-recent"
        [class.tab-btn-active]="activeTab() === 'recent'"
        [attr.aria-pressed]="activeTab() === 'recent'"
        (click)="activeTab.set('recent')"
      >
        Recent
      </button>
      <button
        type="button"
        class="tab-btn tab-followed"
        [class.tab-btn-active]="activeTab() === 'followed'"
        [attr.aria-pressed]="activeTab() === 'followed'"
        (click)="activeTab.set('followed')"
      >
        Followed
      </button>
    </div>
    <app-new-review-chip [restaurantId]="restaurantId()" />
  </div>

  @if (loading()) {
    <div class="no-visits">Loading…</div>
  } @else if (loadError()) {
    <div class="no-visits load-error">Couldn't load the ratings</div>
  } @else {
    @for (card of cards(); track ratingKey(card.rating)) {
      <app-rating-card [rating]="card.rating" [own]="card.own" [actions]="card.actions" />
    } @empty {
      <div class="no-visits">{{ emptyMessage() }}</div>
    }
  }
</div>

@if (pendingDeletion()) {
  <app-confirm-dialog
    [heading]="deletionHeading()"
    [message]="deletionMessage()"
    confirmLabel="Delete"
    busyLabel="Deleting…"
    [busy]="deleting()"
    [error]="deleteError()"
    (confirmed)="confirmDeletion()"
    (closed)="cancelDeletion()"
  />
}
