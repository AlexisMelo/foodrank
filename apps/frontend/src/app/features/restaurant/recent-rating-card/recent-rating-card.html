<a [routerLink]="profileLink()" class="community-card">
  <div class="community-user">
    @if (rating().userAvatarUrl; as avatarUrl) {
      <img [src]="avatarUrl" alt="" class="community-avatar community-avatar-img" />
    } @else {
      <span class="community-avatar">{{ initial() }}</span>
    }
    <div class="community-user-info">
      <span class="community-name">{{ rating().userName }}</span>
      <span class="community-date">
        {{ displayedDate() }}
        @if (rating().bonus) {
          <span title="Instant crush">💘</span>
        }
      </span>
    </div>
  </div>
  <div class="community-scores">
    <app-rating-scores
      [food]="rating().food"
      [service]="rating().service"
      [decor]="rating().setting"
    />
    <span class="community-avg" [style.background-color]="scoreColor(average())">
      {{ average() }}
    </span>
  </div>
</a>
