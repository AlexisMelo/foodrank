<div class="criteria-averages">
  @if (summary().count === 0) {
    <p class="no-rating">No ratings yet</p>
  } @else {
    @for (criterion of criteria(); track criterion.label) {
      <div class="criterion">
        <span class="criterion-label">{{ criterion.label }}</span>
        <span class="criterion-score" [style.color]="scoreColor(criterion.score)">{{
          criterion.score
        }}</span>
      </div>
    }
    <span class="rating-count">{{ countLabel() }}</span>
  }
</div>
