<div class="explore">
  <div class="page-header">
    <h1 class="page-title">Explore</h1>
    <p class="page-subtitle">Places you haven't tried yet</p>
  </div>

  @if (loading()) {
    <div class="loading" role="status" aria-label="Loading">🍽️</div>
  } @else {
    @if (locationDenied()) {
      <div class="location-notice">📍 Enable location to sort by distance</div>
    }

    <div class="cards-scroll">
      @for (suggestion of suggestions(); track suggestion.restaurant.id) {
        <button
          type="button"
          class="restaurant-card"
          (click)="openRestaurant(suggestion.restaurant)"
        >
          <span class="card-emoji" aria-hidden="true">{{ suggestion.restaurant.emoji }}</span>
          <span class="card-name">{{ suggestion.restaurant.name }}</span>
          @if (suggestion.distanceKm !== null) {
            <span class="card-distance">📍 {{ formatDistance(suggestion.distanceKm) }}</span>
          } @else {
            <span class="card-distance muted">{{ suggestion.restaurant.cuisine }}</span>
          }
        </button>
      }
    </div>
  }
</div>
