<div class="account-settings">
  <app-page-top-bar title="Account" backTo="/settings" />

  <nav class="sections" aria-label="Account">
    <a routerLink="/profile/edit" class="section-link">
      <span class="section-link-title">Edit profile</span>
      <svg
        class="section-link-arrow"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <polyline points="9 18 15 12 9 6" />
      </svg>
    </a>
  </nav>

  <button type="button" class="delete-account-btn" (click)="deleteAccountOpen.set(true)">
    Delete account
  </button>

  @if (deleteAccountOpen()) {
    <app-delete-account-modal (closed)="deleteAccountOpen.set(false)" />
  }
</div>
