<app-confirm-dialog
  heading="Delete your account ?"
  message="Your profile, ratings and tierlists will be permanently deleted. This cannot be undone."
  confirmLabel="Delete"
  busyLabel="Deleting…"
  [busy]="loading()"
  [canConfirm]="canConfirm()"
  [error]="error()"
  (confirmed)="confirm()"
  (closed)="closed.emit()"
  (opened)="focusPassword()"
>
  <label class="label" for="delete-account-password">Enter your password to confirm</label>
  <input
    #passwordInput
    id="delete-account-password"
    class="input"
    type="password"
    placeholder="Your password"
    autocomplete="current-password"
    [formField]="form.password"
  />
</app-confirm-dialog>
