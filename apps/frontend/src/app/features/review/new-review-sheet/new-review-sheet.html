@if (newReview.isOpen()) {
  <!-- The overlay click is a mouse shortcut: Esc (cancel event) and the Close button are its keyboard equivalents -->
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -->
  <dialog
    #dialog
    class="overlay"
    aria-labelledby="new-review-sheet-title"
    animate.enter="overlay-enter"
    animate.leave="overlay-leave"
    (cancel)="cancel($event)"
    (close)="newReview.close()"
    (click)="closeOnOverlay($event)"
  >
    <div class="sheet" animate.enter="sheet-enter">
      <div class="header">
        <h2 id="new-review-sheet-title" class="title">Restaurant</h2>
        <button type="button" class="close-btn" aria-label="Close" (click)="newReview.close()">
          ✕
        </button>
      </div>

      <form class="search-row" (submit)="submitSearch($event)">
        <input
          #searchInput
          class="search-input"
          type="text"
          placeholder="Search a restaurant…"
          aria-label="Search a restaurant"
          [formField]="searchForm.query"
        />
        <button type="submit" class="search-btn" aria-label="Search">🔍</button>
      </form>

      <app-search-area-hint />

      <!-- Suggestions — rendered outside the flow of search-row -->
      <div class="suggestions-area">
        @if (loading()) {
          <div class="hint">Searching…</div>
        } @else if (error()) {
          <div class="hint">Search is unavailable right now</div>
        } @else if (noResults()) {
          <div class="hint">No restaurants found</div>
        } @else if (suggestions().length) {
          <ul class="suggestions">
            @for (s of suggestions(); track s.placeId) {
              <li>
                <button type="button" class="suggestion-item" (click)="selectPlace(s)">
                  <span class="suggestion-emoji" aria-hidden="true">🍽️</span>
                  <span class="suggestion-info">
                    <span class="suggestion-name">{{ s.name }}</span>
                    <span class="suggestion-meta">{{ s.secondaryText }}</span>
                  </span>
                </button>
              </li>
            }
          </ul>
          <p class="attribution">
            ©
            <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">
              OpenStreetMap contributors
            </a>
          </p>
        }
      </div>
    </div>
  </dialog>
}
