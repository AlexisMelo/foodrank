@if (invalidLink()) {
  <div class="invalid">
    <p class="invalid-title">Invalid or expired link</p>
    <p class="invalid-body">Request a new reset link from the sign-in page.</p>
  </div>
  <button type="button" class="btn-link" (click)="router.navigateByUrl('/', { replaceUrl: true })">
    ← Back to sign in
  </button>
} @else {
  <p class="subtitle">Choose a new password for your account.</p>

  <form class="form" (submit)="submit($event)">
    <label class="label" for="new-password">New password</label>
    <input
      id="new-password"
      class="input"
      type="password"
      placeholder="Choose a strong password"
      autocomplete="new-password"
      [formField]="form.password"
    />

    <app-password-criteria [password]="model().password" />

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button class="btn-primary" type="submit" [disabled]="loading() || !canSubmit()">
      @if (loading()) {
        <span class="spinner"></span>
      } @else {
        <span>Set new password</span>
      }
    </button>
  </form>
}
