<p class="subtitle">Enter your email and we'll send you a reset link.</p>

@if (sent()) {
  <div class="success">
    <p class="success-title">Check your inbox</p>
    <p class="success-body">
      If an account exists for <strong>{{ model().email }}</strong
      >, a reset link has been sent.
    </p>
  </div>
} @else {
  <form class="form" (submit)="submit($event)">
    <label class="label" for="forgot-email">Email address</label>
    <input
      id="forgot-email"
      class="input"
      type="email"
      placeholder="you@example.com"
      autocomplete="email"
      [formField]="form.email"
    />

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button class="btn-primary" type="submit" [disabled]="loading()">
      @if (loading()) {
        <span class="spinner"></span>
      } @else {
        <span>Send reset link</span>
      }
    </button>
  </form>
}

<button type="button" class="btn-link" (click)="goToLogin.emit()">← Back to sign in</button>
