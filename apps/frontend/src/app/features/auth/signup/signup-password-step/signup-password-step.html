<app-signup-step-layout [step]="2" title="Create a password" [backTo]="backTo">
  <form class="form" (submit)="submit($event)">
    <label class="label" for="signup-password">Password</label>
    <input
      id="signup-password"
      class="input"
      type="password"
      placeholder="Choose a password"
      autocomplete="new-password"
      [formField]="form.password"
    />

    <app-password-criteria [password]="draft().password" />

    <button class="btn-primary" type="submit" [disabled]="!canContinue()">Continue</button>
  </form>
</app-signup-step-layout>
