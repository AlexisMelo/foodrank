<div class="signup-step">
  <a
    [routerLink]="backTo().path"
    [queryParams]="backTo().query"
    class="back-link"
    aria-label="Back"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <line x1="19" y1="12" x2="5" y2="12" />
      <polyline points="12 19 5 12 12 5" />
    </svg>
  </a>

  <div class="progress-header">
    <span class="step-label">Step {{ step() }}</span>
    <div
      class="progress"
      role="progressbar"
      aria-valuemin="1"
      [attr.aria-valuemax]="stepCount"
      [attr.aria-valuenow]="step()"
      [attr.aria-valuetext]="'Step ' + step() + ' of ' + stepCount"
    >
      <div class="progress-fill" [style.width.%]="progress()"></div>
    </div>
  </div>

  <h1 class="step-title">{{ title() }}</h1>

  <ng-content />
</div>
