<div class="winner-section">
  <div class="winner-avatar-wrap">
    <app-user-avatar
      [name]="profile() | displayedName"
      [avatarUrl]="profile().avatarUrl"
      class="winner-avatar"
    />
  </div>
  <h2 class="winner-name">{{ profile() | displayedName }}</h2>
  @if (profile().displayName) {
    <p class="winner-username">&#64;{{ profile().username }}</p>
  }
  <!-- Under the name: the follows of the profile -->
  <ng-content />
  <div class="winner-chips">
    <div class="winner-tag">{{ countLabel() }}</div>
    @if (editable()) {
      <a routerLink="/profile/edit" class="edit-profile-btn">Edit profile</a>
    }
    <!-- On another user's profile: the follow button -->
    <ng-content select="app-follow-button" />
  </div>
</div>
