<a
  [routerLink]="['/restaurant', restaurantId()]"
  class="review-card"
  [class.inactive]="!active()"
  [attr.title]="active() ? null : 'Replaced by a more recent rating'"
>
  <div class="emoji-wrap">
    <div class="emoji-circle">{{ emoji() }}</div>
    <div class="avg-bubble" [style.background-color]="scoreColor(average())">
      {{ average() | score }}
    </div>
  </div>
  <span class="restaurant-name">{{ name() }}</span>
  <span class="visit-date">{{ displayedDate() }}</span>
  <div class="scores">
    <app-rating-scores [food]="food()" [service]="service()" [decor]="decor()" />
  </div>
</a>
