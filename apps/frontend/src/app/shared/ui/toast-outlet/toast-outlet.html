@if (active()) {
  <div class="toasts">
    @for (toast of toastStore.toasts(); track toast.id) {
      <!-- An error interrupts the screen reader; a confirmation waits for it to finish -->
      <div
        class="toast"
        [class.toast-success]="toast.kind === 'success'"
        [attr.role]="toast.kind === 'error' ? 'alert' : 'status'"
        animate.enter="toast-enter"
      >
        <span class="toast-message">{{ toast.message }}</span>
        <button
          type="button"
          class="toast-close"
          aria-label="Dismiss"
          (click)="toastStore.dismiss(toast.id)"
        >
          ✕
        </button>
      </div>
    }
  </div>
}
