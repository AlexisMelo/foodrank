@if (active()) {
  <div class="toasts">
    @for (toast of toastStore.toasts(); track toast.id) {
      <div class="toast" role="alert" animate.enter="toast-enter">
        <span class="toast-message">{{ toast.message }}</span>
        <button
          type="button"
          class="toast-close"
          aria-label="Dismiss"
          (click)="toastStore.dismiss(toast.id)"
        >
          ✕
        </button>
      </div>
    }
  </div>
}
