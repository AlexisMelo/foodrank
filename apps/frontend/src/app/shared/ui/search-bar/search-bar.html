<form class="search-row" role="search" (submit)="submit($event)">
  <input
    #field
    class="search-input"
    type="text"
    enterkeyhint="search"
    autocomplete="off"
    placeholder="Search a restaurant or a profile…"
    aria-label="Search a restaurant or a profile"
    [formField]="searchForm.query"
  />
  <button type="submit" class="search-btn" aria-label="Search">🔍</button>
</form>
